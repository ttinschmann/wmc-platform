<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>WMC Command Center</title>
<meta name="robots" content="noindex, nofollow">
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: linke Navigationsleiste (Screens), oben globale Steuerleiste (Ebene, Lage, Blick, Rolle, Datenstatus), rechts Arbeitsfläche. Kacheln sind die Grundeinheit. */
:root{
  --bg:#F7F5F3; --surface:#FFFFFF; --surface2:#EAE4E1; --line:#CBCDD3; --line2:#DDD6D1;
  --fg:#1C2024; --fg2:#2D3C4B; --muted:#6B6F76; --brand:#D55D05; --brand2:#3C261D; --beige:#C1B2AA; --brown:#735C4F;
  --rot:#B42318; --rotbg:#FBE9E7; --gelb:#B07A00; --gelbbg:#FBF1D6; --gruen:#1F7A3F; --gruenbg:#E3F2E7; --blau:#2D5F8B; --blaubg:#E4EDF5;
  --sans:"HelveticaNeueLT Pro 55 Roman","Helvetica Neue",Helvetica,Arial,system-ui,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --radius:6px; --shadow:0 1px 2px rgba(28,32,36,.06),0 2px 8px rgba(28,32,36,.05);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#17191C; --surface:#1F2327; --surface2:#2A2E33; --line:#3A3F46; --line2:#33383E;
  --fg:#ECEAE7; --fg2:#D7D2CD; --muted:#A3A7AD; --brand:#E8772B; --brand2:#D9C7BD; --beige:#7A6B62; --brown:#B29A8C;
  --rot:#F0776C; --rotbg:#3A2320; --gelb:#E2B23A; --gelbbg:#3A3220; --gruen:#5BC57F; --gruenbg:#1F3A28; --blau:#7FB0DC; --blaubg:#213444;
  --shadow:0 1px 2px rgba(0,0,0,.4); color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#17191C; --surface:#1F2327; --surface2:#2A2E33; --line:#3A3F46; --line2:#33383E;
  --fg:#ECEAE7; --fg2:#D7D2CD; --muted:#A3A7AD; --brand:#E8772B; --brand2:#D9C7BD; --beige:#7A6B62; --brown:#B29A8C;
  --rot:#F0776C; --rotbg:#3A2320; --gelb:#E2B23A; --gelbbg:#3A3220; --gruen:#5BC57F; --gruenbg:#1F3A28; --blau:#7FB0DC; --blaubg:#213444;
  --shadow:0 1px 2px rgba(0,0,0,.4); color-scheme:dark }

*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
a{color:var(--blau)}
button{font:inherit;color:inherit}
h1,h2,h3{margin:0;font-weight:600;text-wrap:balance;color:var(--fg)}
h1{font-size:22px;letter-spacing:-.01em}
h2{font-size:17px}
h3{font-size:14px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
p{margin:0}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:13px}
.xs{font-size:12px}
.mono{font-family:var(--mono);font-size:12px}

/* App-Rahmen */
.app{display:grid;grid-template-rows:auto 1fr;grid-template-columns:220px 1fr;min-height:100%}
.topbar{grid-column:1/-1;position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--surface);border-bottom:1px solid var(--line);
  display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px;padding-block:5px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.brand{display:flex;align-items:center;gap:10px;margin-right:auto}
.brand .mark{width:24px;height:24px;border-radius:4px;background:var(--brand);position:relative}
.brand .mark::after{content:"";position:absolute;inset:7px;border:2px solid #fff;border-radius:2px}
.brand b{font-size:14px;letter-spacing:.02em}
.brand span{color:var(--muted);font-size:12px}
@media (max-width:2000px){ .brand span{display:none} .brand{margin-right:4px} }
.ctl{display:flex;align-items:center;gap:6px;font-size:12px}
.ctl label{color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-size:11px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;background:var(--surface)}
.seg button{border:0;background:transparent;padding:4px 7px;cursor:pointer;font-size:11.5px;color:var(--fg2);border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--fg2);color:#fff}
.seg button:focus-visible,.btn:focus-visible,.tile:focus-visible,.navlink:focus-visible{outline:2px solid var(--brand);outline-offset:1px}
.datastat{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:3px 9px;background:var(--surface);cursor:pointer;font-size:11.5px}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block;background:var(--gruen)}
.dot.gelb{background:var(--gelb)} .dot.rot{background:var(--rot)}
.demo{background:var(--brand2);color:#fff;font-size:10px;letter-spacing:.08em;text-transform:uppercase;padding:4px 8px;border-radius:3px;font-weight:600}
:root[data-theme="dark"] .demo, .dark .demo{color:var(--bg)}

.side{background:var(--surface);border-right:1px solid var(--line);padding:10px 10px 14px max(10px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:2px;position:sticky;top:var(--topH,0px);align-self:start;max-height:calc(100vh - var(--topH,0px));overflow-y:auto;scrollbar-width:thin}
.side h3{padding:6px 10px 2px}
.navlink{display:flex;align-items:center;gap:8px;padding:5px 10px;border-radius:var(--radius);text-decoration:none;color:var(--fg2);font-size:13px;border:0;background:transparent;text-align:left;width:100%;cursor:pointer}
.navlink .id{font-family:var(--mono);font-size:11px;color:var(--muted);width:28px}
.navlink:hover{background:var(--surface2)}
.navlink.active{background:var(--fg2);color:#fff}
.navlink.active .id{color:#fff;opacity:.8}
.navlink .flag{margin-left:auto;font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.navlink.active .flag{color:#fff;opacity:.8}
.side .foot{margin-top:8px;padding:8px 10px 0;font-size:11px;color:var(--muted);line-height:1.4}

.main{padding-block:18px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));min-width:0}
.head{display:flex;flex-wrap:wrap;align-items:baseline;gap:8px 16px;margin-bottom:14px}
.head .crumb{font-family:var(--mono);font-size:12px;color:var(--brand)}
.head .sub{color:var(--muted);font-size:13px;width:100%}
.grid{display:grid;gap:12px}
.g5{grid-template-columns:repeat(5,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g32{grid-template-columns:minmax(0,3fr) minmax(0,2fr)}
.g21{grid-template-columns:minmax(0,2fr) minmax(0,1fr)}
.gauto{grid-template-columns:repeat(auto-fill,minmax(240px,1fr))}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px;min-width:0}
.card.flat{background:transparent;border-style:dashed}
.card h3{margin-bottom:8px}
.stack{display:flex;flex-direction:column;gap:10px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.between{justify-content:space-between}

/* Statusfarben: immer mit Symbol und Text (P10) */
.st{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:2px 8px;border-radius:999px;border:1px solid transparent}
.st::before{content:"";width:8px;height:8px;border-radius:2px;background:currentColor}
.st.rot{color:var(--rot);background:var(--rotbg)} .st.rot::before{border-radius:50%}
.st.gelb{color:var(--gelb);background:var(--gelbbg)} .st.gelb::before{transform:rotate(45deg)}
.st.gruen{color:var(--gruen);background:var(--gruenbg)} .st.gruen::before{border-radius:0}
.st.blau{color:var(--blau);background:var(--blaubg)}
.st.grau{color:var(--muted);background:var(--surface2)}
.stripe{border-left:4px solid var(--line)}
.stripe.rot{border-left-color:var(--rot)} .stripe.gelb{border-left-color:var(--gelb)} .stripe.gruen{border-left-color:var(--gruen)} .stripe.grau{border-left-color:var(--line)}

/* Kacheln (Anatomie: Titel, Kernaussage, Eigentümer, Frist, Quelle, Stand, Klickziel) */
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px;cursor:pointer;text-align:left;display:flex;flex-direction:column;gap:6px;min-width:0;box-shadow:var(--shadow);transition:transform .08s}
.tile:hover{transform:translateY(-1px);border-color:var(--beige)}
.tile .t{font-weight:600;font-size:15px;line-height:1.25}
.tile .v{font-size:26px;font-weight:600;letter-spacing:-.01em;line-height:1.1}
.tile .d{font-size:13px;color:var(--fg2)}
.tile .meta{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:11px;color:var(--muted);margin-top:auto;padding-top:6px;border-top:1px dashed var(--line2)}
.tile .meta b{color:var(--fg2);font-weight:600}
.tile.rot .t::before,.tile.gelb .t::before,.tile.gruen .t::before{content:"";display:inline-block;width:9px;height:9px;margin-right:7px;vertical-align:1px}
.tile.rot .t::before{background:var(--rot);border-radius:50%}
.tile.gelb .t::before{background:var(--gelb);transform:rotate(45deg)}
.tile.gruen .t::before{background:var(--gruen)}
.tile.done{opacity:.55}

/* Vorbild-Tags (Herkunft aus anderen Industrien), ein- und ausblendbar */
.vb{display:inline-flex;align-items:center;gap:4px;font-size:10.5px;letter-spacing:.03em;color:var(--brown);border:1px dashed var(--beige);border-radius:3px;padding:1px 6px;text-transform:uppercase}
body:not(.showvb) .vb{display:none}

.btn{border:1px solid var(--line);background:var(--surface);border-radius:var(--radius);padding:7px 12px;cursor:pointer;font-size:13px;color:var(--fg2)}
.btn:hover{border-color:var(--beige);background:var(--surface2)}
.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.primary:hover{filter:brightness(.95)}
.btn.sm{padding:4px 9px;font-size:12px}
.btn[disabled]{opacity:.5;cursor:default}

table{border-collapse:collapse;width:100%;font-size:13px}
th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600;padding:6px 8px;border-bottom:1px solid var(--line)}
td{padding:7px 8px;border-bottom:1px solid var(--line2);vertical-align:top}
td.r,th.r{text-align:right}
tr.clickable{cursor:pointer} tr.clickable:hover td{background:var(--surface2)}
.tscroll{overflow-x:auto}

.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:13px}
.kv dt{color:var(--muted)} .kv dd{margin:0}

/* Andon-Leiste */
.andon{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:4px}
.andon div{padding:7px 8px;border-radius:4px;font-size:12px;font-weight:600;color:#fff;text-align:center;background:var(--muted)}
.andon .rot{background:var(--rot)} .andon .gelb{background:var(--gelb)} .andon .gruen{background:var(--gruen)}

/* Diagramme */
svg{display:block;max-width:100%}
.axis{stroke:var(--line);stroke-width:1}
.grid-l{stroke:var(--line2);stroke-width:1;stroke-dasharray:2 3}
.lbl{fill:var(--muted);font-size:11px;font-family:var(--sans)}
.lbl.b{fill:var(--fg);font-weight:600}
.ln{fill:none;stroke:var(--fg2);stroke-width:2}
.ln.brand{stroke:var(--brand)}
.band{fill:var(--brand);opacity:.15}
.cap{stroke:var(--rot);stroke-width:1.5;stroke-dasharray:5 4}
.node{fill:var(--surface);stroke:var(--line);stroke-width:1.5}
.node.rot{stroke:var(--rot);stroke-width:2.5} .node.gelb{stroke:var(--gelb);stroke-width:2.5} .node.gruen{stroke:var(--gruen);stroke-width:2}
.edge{stroke:var(--line);stroke-width:2;fill:none}
.edge.rot{stroke:var(--rot);stroke-width:3}
.edge.gelb{stroke:var(--gelb);stroke-width:2.5}
.bar-belegt{fill:var(--fg2)} .bar-frei{fill:var(--gruen)} .bar-gesperrt{fill:var(--rot)} .bar-reinigung{fill:var(--gelb)} .bar-np{fill:var(--beige)}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}

/* Stufenleiste */
.stufen{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.stufe{border:1px solid var(--line);border-radius:var(--radius);padding:10px;background:var(--surface);cursor:pointer;min-width:0}
.stufe b{display:block;font-size:20px}
.stufe .n{font-size:12px;color:var(--muted)}
.stufe.on{border-color:var(--brand);background:var(--surface2);box-shadow:inset 0 0 0 1px var(--brand)}
.stufe.on b{color:var(--brand)}

/* Modal */
.ovl{position:fixed;inset:0;background:rgba(28,32,36,.45);display:none;align-items:center;justify-content:center;z-index:20;padding:16px}
.ovl.open{display:flex}
.modal{background:var(--surface);border:1px solid var(--line);border-radius:8px;max-width:760px;width:100%;max-height:90vh;overflow:auto;box-shadow:0 10px 40px rgba(0,0,0,.25)}
.modal header{display:flex;align-items:flex-start;gap:12px;padding:16px 18px;border-bottom:1px solid var(--line)}
.modal header h2{flex:1}
.modal .body{padding:16px 18px;display:flex;flex-direction:column;gap:14px}
.modal footer{padding:12px 18px;border-top:1px solid var(--line);display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end}
.opt{border:1px solid var(--line);border-radius:var(--radius);padding:10px 12px;display:grid;grid-template-columns:28px 1fr auto;gap:10px;align-items:center}
.opt b.k{font-family:var(--mono);font-size:14px;color:var(--brand)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg2);color:#fff;padding:10px 16px;border-radius:999px;font-size:13px;z-index:30;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}
.gantt-row{display:grid;grid-template-columns:70px 1fr;align-items:center;gap:8px;font-size:12px}
.placeholder{border:1px dashed var(--line);border-radius:var(--radius);padding:28px;text-align:center;color:var(--muted)}
.log{font-size:12px;display:flex;flex-direction:column;gap:6px}
.log div{display:grid;grid-template-columns:52px 1fr;gap:10px}
.log .t{font-family:var(--mono);color:var(--muted)}
.huddle-item{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line2)}
.huddle-item .min{font-family:var(--mono);font-size:12px;color:var(--brand);width:52px}
input[type=text],select,textarea{font:inherit;color:inherit;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:7px 9px;width:100%}
textarea{min-height:70px;resize:vertical}
.pill{font-size:11px;border:1px solid var(--line);border-radius:999px;padding:2px 8px;color:var(--muted)}
.kpi{display:flex;flex-direction:column;gap:2px}
.kpi .v{font-size:24px;font-weight:600;letter-spacing:-.01em}
.kpi .l{font-size:12px;color:var(--muted)}
.kpi .z{font-size:12px}
.map-house{cursor:pointer}
.gate{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.gate div{border:1px solid var(--line);border-radius:4px;padding:8px;font-size:12px;text-align:center}
.gate div b{display:block;font-size:18px}
.gate .ok{border-color:var(--gruen);background:var(--gruenbg)} .gate .warn{border-color:var(--gelb);background:var(--gelbbg)} .gate .bad{border-color:var(--rot);background:var(--rotbg)}

/* S0: eine Bildschirmseite ohne Scrollen */
.s0{display:flex;flex-direction:column;gap:10px}
.s0 .head{margin-bottom:0} .s0 h1{font-size:19px}
.s0 .card{padding:10px 12px} .s0 .tile{padding:9px 12px;gap:3px} .s0 .tile .t{font-size:14px} .s0 .tile .v{font-size:clamp(17px,1.4vw,21px)} .s0 .tile .d{font-size:12px;line-height:1.3} .s0 .tile .meta{padding-top:4px;font-size:10.5px}
.s0 .kpi .v{font-size:19px} .s0 .kpi .l,.s0 .kpi .z{font-size:11px}
.s0 .andon div{padding:5px 6px;font-size:11px} .s0 .andon{grid-template-columns:repeat(4,minmax(0,1fr))}
.s0 .gate div{padding:6px} .s0 .gate div b{font-size:16px}
.s0 .hs{display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center;text-align:left;cursor:pointer}
.s0 .hs .kpi .v{font-size:30px}
.main.s0main{padding-block:10px 12px}
@media (max-width:1100px){ .g5{grid-template-columns:repeat(3,minmax(0,1fr))} .g4{grid-template-columns:repeat(2,minmax(0,1fr))} .g32,.g21{grid-template-columns:1fr} .andon{grid-template-columns:repeat(4,minmax(0,1fr))} }
@media (max-width:860px){
  .app{grid-template-columns:minmax(0,1fr)}
#login input:focus-visible,#login button:focus-visible{outline:2px solid #D55D05;outline-offset:2px}
.app[hidden]{display:none}
  .side{position:static;max-height:none;border-right:0;min-width:0;border-bottom:1px solid var(--line);flex-direction:row;flex-wrap:nowrap;overflow-x:auto;gap:4px;padding:8px max(16px,env(safe-area-inset-right,0px)) 8px max(16px,env(safe-area-inset-left,0px))}
  .side h3,.side .foot{display:none}
  .navlink{white-space:nowrap;width:auto;padding:6px 10px}
  .navlink .flag{display:none}
  .g5,.g3,.g2{grid-template-columns:1fr 1fr}
  .stufen{grid-template-columns:repeat(5,minmax(0,1fr))}
  .gate{grid-template-columns:1fr}
}
@media (max-width:560px){ .g5,.g4,.g3,.g2{grid-template-columns:1fr} .andon{grid-template-columns:repeat(2,minmax(0,1fr))} .opt{grid-template-columns:28px 1fr} .opt .btn{grid-column:2}
  .topbar{gap:8px 12px} .ctl{flex-wrap:wrap;max-width:100%} .seg{flex-wrap:wrap;max-width:100%} .seg button{border-right:0;border-bottom:1px solid var(--line)} .brand span{display:none} .app{grid-template-columns:minmax(0,1fr)} .side{max-width:100vw} }
@media (prefers-reduced-motion:reduce){ .tile{transition:none} .toast{transition:none} }
</style>
</head>
<body>
<section id="login" class="screen" hidden>
  <div style="min-height: 100vh; box-sizing: border-box; display: flex; align-items: center; justify-content: center; background: #3C261D; padding: 24px max(16px,env(safe-area-inset-right,0px)) 24px max(16px,env(safe-area-inset-left,0px))">
    <form id="loginform" style="width: 100%; max-width: 400px; background: #fff; border-radius: 16px; padding: 32px 28px; box-sizing: border-box; display: flex; flex-direction: column; gap: 14px; box-shadow: 0 20px 60px rgba(0,0,0,.35)">
      <div><div style="font-size: 30px; font-weight: 800; letter-spacing: -1px; color: #3C261D; line-height: 1">WMC</div><div style="font-size: 9px; letter-spacing: 3px; color: #C1B2AA; font-weight: 600; margin-top: 2px">HEALTHCARE</div><div style="margin-top: 10px; display: inline-flex; align-items: center; gap: 8px; color: #1C2024; font-size: 13px; font-weight: 600"><span style="width: 8px; height: 8px; border-radius: 50%; background: #D55C05; display: inline-block"></span>Command Center</div></div>
      <h1 style="margin: 4px 0 0; font-size: 20px; font-weight: 700; color: #1C2024">Anmelden</h1>
      <label for="lu" style="font-size: 12px; font-weight: 600; color: #5E5652">Benutzername</label>
      <input id="lu" type="text" autocomplete="username" placeholder="vorname.nachname" style="font: inherit; font-size: 15px; padding: 11px 12px; border: 1px solid #C1B2AA; border-radius: 8px; min-height: 44px">
      <label for="lp" style="font-size: 12px; font-weight: 600; color: #5E5652">Passwort</label>
      <input id="lp" type="password" autocomplete="current-password" placeholder="••••••••" style="font: inherit; font-size: 15px; padding: 11px 12px; border: 1px solid #C1B2AA; border-radius: 8px; min-height: 44px">
      <div id="lerr" hidden style="font-size: 12px; color: #8A2525; font-weight: 600">Benutzername oder Passwort unbekannt.</div>
      <button type="submit" style="font: inherit; font-weight: 700; font-size: 15px; min-height: 46px; border: 0; border-radius: 8px; background: #D55C05; color: #fff; cursor: pointer">Anmelden</button>
      <div style="font-size: 11px; color: #5E5652; text-align: center">SSO · Microsoft Entra ID (WMC) · Verschlüsselt in Deutschland · Demo, fiktive Daten</div>
    </form>
  </div>
</section>

  const eg = sum(st,s=>s.eg), eb = sum(st,s=>s.eb);

/* Diagramm-Helfer (Inline-SVG, ohne Bibliothek) */
function spark(vals, w=140, h=36, opt={}){
  const mn = Math.min(...vals, opt.min??Infinity), mx = Math.max(...vals, opt.max??-Infinity); const pad=3;
  const x = i => pad + i*(w-2*pad)/(vals.length-1); const y = v => h-pad-(v-mn)/((mx-mn)||1)*(h-2*pad);
  const pts = vals.map((v,i)=>`${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(' ');
  let ref=''; if(opt.ref!=null){ ref=`<line x1="${pad}" x2="${w-pad}" y1="${y(opt.ref)}" y2="${y(opt.ref)}" class="cap"/>`; }
  return `<svg viewBox="0 0 ${w} ${h}" width="${w}" height="${h}" role="img" aria-label="${opt.label||'Verlauf'}"><polygon points="${pad},${h-pad} ${pts} ${w-pad},${h-pad}" fill="var(--brand)" opacity=".12"/>${ref}<polyline points="${pts}" class="ln brand"/><circle cx="${x(vals.length-1)}" cy="${y(vals[vals.length-1])}" r="3" fill="var(--brand)"/></svg>`;
}
function bars(items, w=320, h=120, opt={}){ // items: [{l, v, cls}]
  const mx = opt.max ?? Math.max(...items.map(i=>i.v)); const bw = (w-20)/items.length; const top=16;
  return `<svg viewBox="0 0 ${w} ${h}" width="100%" style="max-width:${w}px" role="img" aria-label="${opt.label||'Balken'}">`+
    items.map((it,i)=>{ const bh=(it.v/(mx||1))*(h-top-22); const x=10+i*bw+4; const y=h-22-bh;
      return `<rect x="${x}" y="${y}" width="${bw-8}" height="${bh}" rx="2" fill="${it.cls||'var(--fg2)'}"/><text x="${x+(bw-8)/2}" y="${y-4}" text-anchor="middle" class="lbl b">${it.v}${opt.unit||''}</text><text x="${x+(bw-8)/2}" y="${h-7}" text-anchor="middle" class="lbl">${it.l}</text>`; }).join('')+`</svg>`;
}
function icuChart(w=420,h=180){
  const v = D.icu.verlauf72h, kap = D.icu.kap; const pad={l:34,r:14,t:14,b:26}; const ymin=16,ymax=30;
  const x=i=>pad.l+i*(w-pad.l-pad.r)/(v.length-1); const y=val=>pad.t+(ymax-val)/(ymax-ymin)*(h-pad.t-pad.b);
  const line=v.map((p,i)=>`${x(i)},${y(p.w)}`).join(' ');
  const bandPts = v.map((p,i)=>p.max?`${x(i)},${y(p.max)}`:`${x(i)},${y(p.w)}`).join(' ')+' '+[...v].reverse().map((p,i)=>{const j=v.length-1-i; return p.min?`${x(j)},${y(p.min)}`:`${x(j)},${y(p.w)}`;}).join(' ');
  const gridy=[18,20,22,24,26,28].map(g=>`<line x1="${pad.l}" x2="${w-pad.r}" y1="${y(g)}" y2="${y(g)}" class="grid-l"/><text x="${pad.l-6}" y="${y(g)+4}" text-anchor="end" class="lbl">${g}</text>`).join('');
  const xs=v.map((p,i)=>`<text x="${x(i)}" y="${h-8}" text-anchor="middle" class="lbl${p.t==='jetzt'?' b':''}">${p.t}</text>`).join('');
  return `<svg viewBox="0 0 ${w} ${h}" width="100%" style="max-width:${w}px" role="img" aria-label="ICU-Belegung 72 Stunden mit Bandbreite">${gridy}<polygon points="${bandPts}" class="band"/><line x1="${pad.l}" x2="${w-pad.r}" y1="${y(kap)}" y2="${y(kap)}" class="cap"/><text x="${pad.l+4}" y="${y(kap)-5}" text-anchor="start" class="lbl" style="fill:var(--rot)">Kapazität ${kap}</text><line x1="${x(2)}" x2="${x(2)}" y1="${pad.t}" y2="${h-pad.b}" class="axis"/><polyline points="${line}" class="ln brand"/>${v.map((p,i)=>`<circle cx="${x(i)}" cy="${y(p.w)}" r="3.5" fill="${p.w>kap?'var(--rot)':'var(--brand)'}"/><text x="${x(i)}" y="${y(p.w)-9}" text-anchor="middle" class="lbl b">${p.w}</text>`).join('')}${xs}</svg>`;
}
function gantt(){
  const total=480, w=640, rowH=26, h=D.op.programm.length*rowH+26; const l=70;
  const hours=[0,60,120,180,240,300,360,420,480].map(m=>{ const x=l+m/total*(w-l-10); const hh=7+Math.floor((30+m)/60), mm=(30+m)%60; return `<line x1="${x}" x2="${x}" y1="18" y2="${h-6}" class="grid-l"/><text x="${x}" y="12" text-anchor="middle" class="lbl">${String(hh).padStart(2,'0')}:${String(mm).padStart(2,'0')}</text>`; }).join('');
  const rows=D.op.programm.map((r,i)=>{ const y=22+i*rowH; return `<text x="4" y="${y+16}" class="lbl b">Saal ${r.saal}</text>`+r.e.map(e=>{ const x=l+e.s/total*(w-l-10), bw=e.d/total*(w-l-10); const fill=e.gap?'var(--gruenbg)':e.icu?'var(--rotbg)':e.nf?'var(--surface2)':'var(--blaubg)'; const stroke=e.gap?'var(--gruen)':e.icu?'var(--rot)':e.nf?'var(--line)':'var(--blau)';
      return `<rect x="${x}" y="${y+3}" width="${bw}" height="${rowH-7}" rx="3" fill="${fill}" stroke="${stroke}" stroke-width="${e.icu||e.gap?2:1}"${e.gap?' stroke-dasharray="4 3"':''}/><text x="${x+5}" y="${y+16}" class="lbl${e.icu?' b':''}" style="${e.icu?'fill:var(--rot)':''}">${esc(e.a)}${e.icu?' ⚠':''}</text>`; }).join(''); }).join('');
  return `<div class="tscroll"><svg viewBox="0 0 ${w} ${h}" width="${w}" height="${h}" role="img" aria-label="OP-Programm Dienstag je Saal">${hours}${rows}</svg></div>`;
}
function spc(){ // Regelkarte VWD je Woche (Vorbild Pharmaproduktion: Western-Electric-Regel)
  const v=D.oekonomie.vwd_wochen, w=460,h=170, pad={l:34,r:12,t:12,b:24}; const ymin=5.0,ymax=7.0;
  const x=i=>pad.l+i*(w-pad.l-pad.r)/(v.length-1); const y=val=>pad.t+(ymax-val)/(ymax-ymin)*(h-pad.t-pad.b);
  const g=[5.5,6.0,6.5].map(t=>`<line x1="${pad.l}" x2="${w-pad.r}" y1="${y(t)}" y2="${y(t)}" class="grid-l"/><text x="${pad.l-6}" y="${y(t)+4}" text-anchor="end" class="lbl">${de(t.toFixed(1))}</text>`).join('');
  const L=(val,cls,txt)=>`<line x1="${pad.l}" x2="${w-pad.r}" y1="${y(val)}" y2="${y(val)}" class="${cls}"/><text x="${w-pad.r}" y="${y(val)-4}" text-anchor="end" class="lbl">${txt}</text>`;
  const mean = sum(v)/v.length; let run=0; const flags=[];
  v.forEach((p,i)=>{ run = p>mean ? run+1 : 0; if(run>=7) flags.push(i); });
  const pts=v.map((p,i)=>`${x(i)},${y(p)}`).join(' ');
  return `<svg viewBox="0 0 ${w} ${h}" width="100%" style="max-width:${w}px" role="img" aria-label="Regelkarte Verweildauer je Woche">${g}${L(D.oekonomie.vwd_ucl,'cap','obere Grenze')}${L(D.oekonomie.vwd_lcl,'cap','untere Grenze')}${L(D.oekonomie.vwd_ziel,'axis','Ziel InEK 5,9')}<polyline points="${pts}" class="ln"/>${v.map((p,i)=>`<circle cx="${x(i)}" cy="${y(p)}" r="3.5" fill="${p>D.oekonomie.vwd_ucl?'var(--rot)':'var(--fg2)'}"/>`).join('')}${v.map((p,i)=>`<text x="${x(i)}" y="${h-6}" text-anchor="middle" class="lbl">KW${i+1}</text>`).join('')}</svg><p class="xs muted">Mittelwert ${de(mean.toFixed(2))} Tage. Regel: 9 Punkte in Folge über dem Ziel wären ein Signal; aktuell ${v.filter(p=>p>D.oekonomie.vwd_ziel).length} von 12 Wochen über Ziel, kein Lauf. ${vb('Pharmaproduktion, SPC')}</p>`;
}

/* Modal */
function openModal(title, body, footer, sub){
  $('#modal').innerHTML = `<header><div style="flex:1"><h2>${title}</h2>${sub?`<p class="small muted">${sub}</p>`:''}</div><button class="btn sm" id="mClose">Schließen</button></header><div class="body">${body}</div>${footer?`<footer>${footer}</footer>`:''}`;
  $('#ovl').classList.add('open'); $('#mClose').onclick=closeModal; $('#mClose').focus();
}
function closeModal(){ $('#ovl').classList.remove('open'); }
$('#ovl').addEventListener('click', e=>{ if(e.target.id==='ovl') closeModal(); });
document.addEventListener('keydown', e=>{ if(e.key==='Escape') closeModal(); });

/* Detailkarte einer Kachel */
function kachelDetail(k){
  const opts = k.optionen.map(key=>{ const o=D.optionen[key]; return `<div class="opt"><b class="k">${o.k}</b><div>${esc(o.text)}<div class="xs muted">Freigabe: ${esc(o.rolle)}</div></div><button class="btn sm primary" data-opt="${o.k}">${esc(o.btn)}</button></div>`; }).join('') || '<p class="small muted">Keine Handlungsoption nötig.</p>';
  const verlauf = S.log.filter(l=>l.text.includes(k.titel)).map(l=>`<div><span class="t">${l.t}</span><span>${esc(l.text)}</span></div>`).join('') || '<div><span class="t">'+k.stand+'</span><span>Kachel erzeugt aus '+esc(k.quelle)+'</span></div>';
  openModal(`${esc(k.titel)}`,
    `<div class="row">${stat(k.st)} <span class="pill">${esc(k.bereich)}</span> <span class="pill">Eigentümer: ${esc(k.eig)}</span> ${k.frist?`<span class="pill">Frist: ${esc(k.frist)}</span>`:''} <span class="pill">Status: ${esc(k.status)}</span></div>
     <div><h3>1 Ursache</h3><p>${esc(k.ursache)}</p></div>
     <div><h3>2 Kette</h3><p>${esc(k.kette)} <button class="btn sm" data-go="S2">In der Zusammenhangs-Ansicht zeigen</button></p></div>
     <div><h3>3 Handlungsoptionen</h3><div class="stack">${opts}</div></div>
     <div><h3>4 Eskalieren an</h3><div class="row"><button class="btn sm" data-esk="Ärztliche Direktion">Ärztliche Direktion</button><button class="btn sm" data-esk="Pflegedirektion">Pflegedirektion</button><button class="btn sm" data-esk="Geschäftsführung">Geschäftsführung</button><button class="btn sm" data-esk="Supervisor (medizinische Priorisierung)">Supervisor</button></div></div>
     <div><h3>5 Ins Huddle</h3><button class="btn sm" id="kHuddle">Ins Huddle 08:00 übernehmen</button> <button class="btn sm" id="kShelve">Stummschalten mit Begründung</button> ${vb('Alarmmanagement ISA 18.2')}</div>
     <div><h3>6 Verlauf (Audit-Trail)</h3><div class="log">${verlauf}</div></div>
     <p class="xs muted">Quelle: ${esc(k.quelle)} · Stand ${k.stand} · Klickziel ${k.ziel}</p>`,
    `<button class="btn" data-go="${k.ziel}">Zum Screen ${k.ziel}</button>`);
  $('#modal').querySelectorAll('[data-opt]').forEach(b=>b.onclick=()=>freigabe(b.dataset.opt,k));
  $('#modal').querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{ closeModal(); go(b.dataset.go, k.bereich); });
  $('#modal').querySelectorAll('[data-esk]').forEach(b=>b.onclick=()=>{ log(`Eskaliert an ${b.dataset.esk}: ${k.titel}`); toast(`Eskaliert an ${b.dataset.esk}`); kachelDetail(k); });
  $('#kHuddle').onclick=()=>{ if(!S.huddleProt.find(h=>h.id===k.id)){ S.huddleProt.push({id:k.id,titel:k.titel,eig:k.eig,frist:k.frist||'heute',status:'offen'}); log(`Ins Huddle übernommen: ${k.titel}`);} toast('Im Huddle 08:00'); kachelDetail(k); };
  $('#kShelve').onclick=()=>{ openModal('Stummschalten mit Begründung', `<p class="small">Die Kachel wird bis zur gewählten Zeit ausgeblendet. Begründung und Dauer werden protokolliert, die Kachel bleibt im Audit-Trail sichtbar.</p><label class="small" for="shDur">Dauer</label><select id="shDur"><option>bis 10:00</option><option>bis zum Huddle 08:00</option><option>bis morgen 07:00</option></select><label class="small" for="shNote">Begründung (Pflicht)</label><textarea id="shNote"></textarea>`, `<button class="btn primary" id="shOk">Stummschalten</button>`, esc(k.titel));
    $('#shOk').onclick=()=>{ const n=$('#shNote').value.trim(); if(!n){ $('#shNote').focus(); toast('Begründung ist Pflicht'); return; } k.status='stumm'; k.stummBis=$('#shDur').value; log(`Stummgeschaltet ${$('#shDur').value}: ${k.titel} (${n})`); closeModal(); render(); toast('Stummgeschaltet und protokolliert'); }; };

     <div class="card"><div class="row between"><h3>Alarmbudget und Alarmgüte</h3>${vb('ISA 18.2 / EEMUA 191')}</div><div class="grid g3"><div class="kpi"><span class="l">Alarme je Stunde (Leitung)</span><span class="v num">2,4</span><span class="z muted">Ziel ≤ 6, Maximum 12</span></div><div class="kpi"><span class="l">Verteilung hoch / mittel / niedrig</span><span class="v num">30 / 60 / 10 %</span><span class="z">${stat('gelb','Soll 5 / 15 / 80')}</span></div><div class="kpi"><span class="l">Stale Alarms (> 24 h rot)</span><span class="v num">1</span><span class="z muted">Transport, seit gestern</span></div></div>

   <div class="card"><div class="row between"><h3>Regel-Register: jede Schwelle mit Begründung, Verantwortlichem und letztem Review</h3>${vb('ISA 18.2 Master-Alarm-Datenbank · FDA CPV')}</div><div class="tscroll"><table><thead><tr><th>Kachelregel</th><th>Schwelle</th><th>Priorität</th><th>Reaktionszeit</th><th>Verantwortlich</th><th>letztes Review</th><th class="r">Tage ohne Review</th></tr></thead><tbody>${D.regeln.map(r=>`<tr><td><b>${r.k}</b></td><td>${r.schwelle}</td><td>${stat(r.prio==='hoch'?'rot':r.prio==='mittel'?'gelb':'grau',r.prio)}</td><td>${r.reakt}</td><td>${r.eig}</td><td class="num">${r.review}</td><td class="r num" style="${r.tage>45?'color:var(--rot);font-weight:600':''}">${r.tage}</td></tr>`).join('')}</tbody></table></div><p class="xs muted" style="margin-top:6px">Regeln über 45 Tage ohne Review werden im Lenkungskreis vorgelegt. Überwachung ist Dauerzustand mit Triggern, kein Projekt.</p></div>
   <div class="grid g2"><div class="card"><h3>Gegengewichte (Balancing Measures)</h3><dl class="kv"><dt>Alarmlast</dt><dd class="num">10 Kacheln, ${D.kacheln.filter(k=>k.status==='stumm').length} stummgeschaltet</dd><dt>Umplanungen diese Woche</dt><dd class="num">7 Eingriffe, 12 Umbelegungen</dd><dt>Wiederaufnahmen 30 Tage</dt><dd class="num">4,1 %</dd><dt>Überstunden Pflege</dt><dd class="num">+2,3 % ggü. Vormonat</dd><dt>Wartezeit ZNA Median</dt><dd class="num">48 Min</dd></dl><p class="xs muted" style="margin-top:8px">Nichts soll auf Kosten des Patienten oder des Mitarbeiters passieren (P9). ${vb('Pharmaproduktion, Continued Process Verification')}</p></div>

/* =============================================================
   Rendering, Navigation, globale Leiste
   ============================================================= */
function syncTopH(){const t=document.querySelector('.topbar'); if(t) document.documentElement.style.setProperty('--topH', t.offsetHeight+'px');}
window.addEventListener('resize', syncTopH);
function buildTop(){
  const seg=(el,items,cur,fn)=>{ el.innerHTML=items.map(i=>`<button aria-pressed="${String(i)===String(cur)}" data-v="${i}">${i}</button>`).join(''); el.querySelectorAll('button').forEach(b=>b.onclick=()=>fn(b.dataset.v)); };
  seg($('#segEbene'),EBENEN,S.ebene,v=>{ S.ebene=v; if(v!=='Haus') go('S10'); else render(); buildTop(); });
  seg($('#segLage'),['0','1','2','3','4'],S.lage,v=>{ S.lage=+v; log(`Lage auf Stufe ${v} gesetzt`); buildTop(); render(); });
  seg($('#segBlick'),BLICKE,S.blick,v=>{ S.blick=v; buildTop(); render(); });
  seg($('#segRolle'),ROLLEN,S.rolle,v=>{ S.rolle=v; buildTop(); go(ROLLE_START[v]); });
  $('#datastat').onclick=()=>go('S12');
  $('#vbInfo').onclick=()=>openModal('Übertragene Steuerungsmuster aus anderen Industrien', `<p class="small">Was dieses Cockpit von einem BI-Dashboard unterscheidet. Jedes Element trägt im Cockpit eine „Vorbild“-Markierung (Kopfzeile: Vorbilder an).</p><div class="tscroll"><table><thead><tr><th>Element</th><th>Herkunft</th><th>Mechanik</th><th>Quelle</th></tr></thead><tbody>${D.vorbilder.map(v=>`<tr><td><b>${v[0]}</b></td><td class="xs">${v[1]}</td><td class="xs">${v[2]}</td><td class="xs"><a href="${v[3]}" target="_blank" rel="noopener">Link</a></td></tr>`).join('')}</tbody></table></div>`);
  $('#vbToggle').onclick=()=>{ document.body.classList.toggle('showvb'); $('#vbToggle').textContent='Vorbilder: '+(document.body.classList.contains('showvb')?'an':'aus'); };
  syncTopH();
}
function buildSide(cur){
  const groups=[['Management',['S0','S8','S9']],['Leitstand',['S1','S2','S3','S4','S5','S6','S7']],['Verbund und Organisation',['S10','S11','S12','S13','S14']]];
  $('#side').innerHTML = groups.map(g=>`<h3>${g[0]}</h3>`+g[1].map(id=>{ const s=SCREENS.find(x=>x[0]===id); return `<a class="navlink${cur===id?' active':''}" href="#${id}"><span class="id">${id}</span><span>${s[1]}</span><span class="flag">${s[2]}</span></a>`; }).join('')).join('') + `<div class="foot">Rolle: <b>${S.rolle}</b><br>Start je Rolle: ${ROLLE_START[S.rolle]}<br><br>WMC Command Center, Mockup v02, 10/2026. Alle Daten fiktiv.</div>`;
}
function render(){
  let id = (location.hash||'#S0').replace('#',''); if(!R[id]){ id='S0'; }
  buildSide(id);
  const m=$('#main'); m.classList.toggle('s0main', id==='S0'); m.innerHTML = R[id]();
  m.querySelectorAll('[data-go]').forEach(b=>b.onclick=(e)=>{ e.preventDefault(); go(b.dataset.go, b.dataset.filter||null); });
  m.querySelectorAll('[data-clear]').forEach(a=>a.onclick=(e)=>{ e.preventDefault(); S.filter=null; render(); });
  m.querySelectorAll('[data-kachel]').forEach(b=>b.onclick=()=>kachelDetail(D.kacheln.find(k=>k.id===+b.dataset.kachel)));
  m.querySelectorAll('[data-sort]').forEach(b=>b.onclick=()=>{ S.sort=b.dataset.sort; render(); });
  m.querySelectorAll('[data-fstatus]').forEach(b=>b.onclick=()=>{ S.fstatus=b.dataset.fstatus; render(); });
  m.querySelectorAll('[data-station]').forEach(r=>r.onclick=()=>stationDetail(r.dataset.station));
  m.querySelectorAll('[data-waste]').forEach(r=>r.onclick=()=>wasteDetail(+r.dataset.waste));
  m.querySelectorAll('[data-opt]').forEach(b=>b.onclick=()=>freigabe(b.dataset.opt, D.kacheln.find(k=>k.id===+(b.dataset.kid||1))));
  m.querySelectorAll('[data-poll]').forEach(b=>b.onclick=()=>{ S.poll[b.dataset.poll]=b.dataset.val; render(); });
  m.querySelectorAll('[data-lage]').forEach(b=>b.onclick=()=>{ S.lage=+b.dataset.lage; log(`Lage auf Stufe ${S.lage} gesetzt`); buildTop(); render(); });
  m.querySelectorAll('[data-szenario]').forEach(b=>b.onclick=()=>{ S.szenario=b.dataset.szenario; render(); });
  m.querySelectorAll('[data-mass]').forEach(b=>b.onclick=()=>{ const st=D.stufen[S.lage]; log(`Maßnahme freigegeben (Stufe ${S.lage}): ${st.massnahmen[+b.dataset.mass]}`); toast('Maßnahme freigegeben und protokolliert'); render(); });
  m.querySelectorAll('[data-komm]').forEach(b=>b.onclick=()=>{ log(`Kommunikation vorbereitet: ${b.dataset.komm}`); toast(`Vorlage für ${b.dataset.komm} erzeugt`); render(); });
  m.querySelectorAll('[data-house]').forEach(g=>g.onclick=()=>{ const h=D.verbund.find(x=>x.id===g.dataset.house); openModal(esc(h.name), `<div class="grid g3"><div class="kpi"><span class="l">Station</span><span class="v num">${h.stat?pct(h.stat):'–'}</span><span class="z muted">${h.entl} Entl. geplant</span></div><div class="kpi"><span class="l">ICU</span><span class="v num">${h.icu?pct(h.icu):'–'}</span><span class="z muted">${h.verl} Verlegungen geplant</span></div><div class="kpi"><span class="l">OP</span><span class="v num">${h.op?pct(h.op):'–'}</span><span class="z muted">${h.elek} Elektive</span></div></div><dl class="kv"><dt>Verfügbarkeit 1d/3d/5d/7d</dt><dd class="num">${h.verf.join(' / ')}</dd><dt>Verfügbarkeit nach Stufe</dt><dd class="num">Stufe 0: ${h.verf[0]} · Stufe 1: ${h.verf[0]+Math.round(h.elek*0.4)} · Stufe 2: ${h.verf[0]+h.elek} · Stufe 3: ${h.verf[0]+h.elek+h.verl*3}</dd></dl>`, h.id!=='KM'?`<button class="btn primary" id="hAnf">Kapazitätsanfrage vorbereiten</button>`:''); const b=$('#hAnf'); if(b) b.onclick=()=>{ log(`Kapazitätsanfrage vorbereitet: ${h.name}`); closeModal(); toast('Anfrage vorbereitet (Freigabe ÄD)'); }; });
  m.querySelectorAll('[data-prot]').forEach(b=>b.onclick=()=>{ S.huddleProt[+b.dataset.prot].status='erledigt'; render(); });
  m.querySelectorAll('[data-readback]').forEach(b=>b.onclick=()=>{ const p=S.huddleProt[+b.dataset.readback]; openModal('Readback durch Eigentümer', `<p class="small"><b>${esc(p.eig)}</b> bestätigt die Maßnahme mit Inhalt, nicht nur mit „verstanden“.</p><label class="small" for="rbText">Bestätigung (Pflicht)</label><textarea id="rbText" placeholder="z. B. Ich verlege 2 Patienten von ICU auf IMC bis 11:00"></textarea>`, `<button class="btn primary" id="rbOk">Bestätigen</button>`, esc(p.titel)); $('#rbOk').onclick=()=>{ const t=$('#rbText').value.trim(); if(!t){ $('#rbText').focus(); toast('Readback braucht Inhalt'); return; } p.status='in Umsetzung'; log(`Readback ${p.eig}: ${t}`); closeModal(); render(); toast('Bestätigt, in Umsetzung'); }; });
  m.querySelectorAll('[data-quitt]').forEach(b=>b.onclick=()=>{ S.quitt=S.quitt||{}; S.quitt[b.dataset.quitt]=b.dataset.val; render(); });
  const hb=$('#hsBtn'); if(hb) hb.onclick=()=>{ const hs=D.hausstatus; openModal('Hausstatus-Score: Punktetabelle', `<p class="small">Jeder Parameter erhält 0 bis 3 Punkte nach fester Regel; die Summe wird auf 0 bis 100 normiert. Stufen: 0-20 Regelbetrieb · 21-40 erhöht (Hausstufe II) · 41-70 hoch (Hausstufe III) · über 70 sehr hoch. Neubewertung: Regelbetrieb täglich bis 10:00, erhöht alle 4 h, hoch alle 2 h.</p><div class="tscroll"><table><thead><tr><th>Parameter</th><th>Wert</th><th>Regel (0 / 1 / 2 / 3)</th><th class="r">Punkte</th></tr></thead><tbody>${hs.params.map(x=>`<tr><td>${x.p}</td><td class="num">${x.wert}</td><td class="xs muted">${x.regel}</td><td class="r num"><b style="${x.pk>=2?'color:var(--rot)':''}">${x.pk}</b></td></tr>`).join('')}</tbody><tfoot><tr><th colspan="3">Summe ${sum(hs.params,x=>x.pk)} von ${3*hs.params.length} Punkten</th><th class="r num">Score ${hs.score}</th></tr></tfoot></table></div><p class="xs muted">Die Punktetabelle ist eine Hausregel (Regel-Register in S12) und wird im Lenkungskreis festgelegt. Werte fiktiv. ${vb('NHS OPEL 2024-26')}</p>`, `<button class="btn" data-go="S12">Regel-Register (S12)</button><button class="btn primary" id="hsLage">Lagestufe 1 setzen (Freigabe Leitstand)</button>`); $('#hsLage').onclick=()=>{ S.lage=1; log('Lage auf Stufe 1 gesetzt (Hausstatus-Score '+hs.score+')'); buildTop(); closeModal(); render(); toast('Lage Stufe 1 gesetzt'); }; $('#modal').querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{ closeModal(); go(b.dataset.go); }); };
  const hv=$('#hVorlage'); if(hv) hv.onclick=()=>{ D.kacheln.filter(k=>k.st==='rot').forEach(k=>{ if(!S.huddleProt.find(h=>h.id===k.id)) S.huddleProt.push({id:k.id,titel:k.titel,eig:k.eig,frist:k.frist,status:'offen'}); }); log('Huddle-Protokoll aus roten Kacheln erzeugt'); render(); };
  const ha=$('#hAck'); if(ha) ha.onclick=()=>{ log('Schichtübergabe bestätigt (Tagdienst Leitstand)'); toast('Übergabe bestätigt'); };
  window.scrollTo({top:0});
}
window.addEventListener('hashchange', ()=>{ if(!getUser()) return; S.filter = S.filter && (location.hash==='#S1'||location.hash==='#S3'||location.hash==='#S4'||location.hash==='#S5'||location.hash==='#S6'||location.hash==='#S2') ? S.filter : null; render(); });
const USERS={
    "christian.wallwiener":{pw:"wmcChristian2026",first:"Christian",name:"Christian Wallwiener",init:"CW",role:"Geschäftsführer"},
    "tibor.tinschmann":{pw:"wmcTibor2026",first:"Tibor",name:"Dr. Tibor Tinschmann",init:"TT",role:"Partner"},
    "sebastian.fenger":{pw:"wmcSebastian2026",first:"Sebastian",name:"Sebastian Fenger",init:"SF",role:"Projektleitung"},
    "peter.werber":{pw:"wmcPeter2026",first:"Peter",name:"Peter Werber",init:"PW",role:"Medizincontrolling"},
    "alex.thiel":{pw:"wmcAlex2026",first:"Alex",name:"Alex Thiel",init:"AT",role:"Master Mind"},
    "alex.reichmann":{pw:"wmcAlex2026",first:"Alex",name:"Alex Reichmann",init:"AR",role:"Manager"},
    "alex.raabe":{pw:"wmcAlex2026",first:"Alex",name:"Alex Raabe",init:"AR",role:"Manager"},
    "demo":{pw:"wmcGast2026",first:"Gast",name:"Gast (Demo)",init:"G",role:"Beobachter"}
  };
  const LS_KEY='wmc_cc_user';
  function getUser(){ try{ const k=localStorage.getItem(LS_KEY); return k&&USERS[k]?USERS[k]:null; }catch(e){ return null; } }
  function gate(){
    const h=(location.hash||'').slice(1);
    if(h==='logout'){ try{ localStorage.removeItem(LS_KEY); }catch(e){} location.hash='S0'; }
    const u=getUser(); const login=document.getElementById('login'); const app=document.querySelector('.app');
    if(!u){ login.hidden=false; app.hidden=true; window.scrollTo(0,0); return false; }
    login.hidden=true; app.hidden=false; return true;
  }
  document.getElementById('loginform').addEventListener('submit', e=>{
    e.preventDefault();
    const k=document.getElementById('lu').value.trim().toLowerCase().replace(/\s+/g,'.');
    const p=document.getElementById('lp').value; const err=document.getElementById('lerr');
    if(USERS[k]&&p===USERS[k].pw){ try{ localStorage.setItem(LS_KEY,k); }catch(x){} err.hidden=true; gate(); render(); }
    else { err.hidden=false; }
  });

window.addEventListener('hashchange', gate);
buildTop(); if(gate()) render();
</script>
